# Compila Deytra en la nube cada vez que se sube un cambio.
# Resultado: una versión web y un APK de Android para probar en el teléfono,
# descargables desde la pestaña "Actions" del repositorio.
name: Compilar Deytra

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Revisión del código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Versión web
        run: flutter build web --release

      - name: APK de prueba para Android
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: deytra-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: deytra-web
          path: build/web
