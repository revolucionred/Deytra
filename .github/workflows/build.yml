# Compila Deytra en la nube cada vez que se sube un cambio.
# Resultado: la versión web publicada en GitHub Pages (para probar desde el iPhone)
# y un APK de Android, descargable desde la pestaña "Actions".
name: Compilar Deytra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Revisión del código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Versión web
        run: flutter build web --release --base-href /Deytra/

      - name: Página para rutas directas
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: APK de prueba para Android
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: deytra-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  publicar-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
